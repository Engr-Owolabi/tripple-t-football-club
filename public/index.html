<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tripple T FC - Day 9 Complete CRUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⚽ Tripple T Football Club</h1>
    <p>Day 9 - Complete CRUD + Search + Validation | Built by Owolabi</p>
  </header>

  <div class="container">
    <div class="stats-grid" id="statsGrid"></div>

    <section class="form-section">
      <h2>➕ Add New Player</h2>
      <form id="addPlayerForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="number" id="age" placeholder="Age" min="0" max="100" required>
        <input type="text" id="position" placeholder="Position" required>
        <input type="number" id="jersey" placeholder="Jersey" min="1" max="99">
        <input type="number" id="goals" placeholder="Goals" min="0">
        <input type="number" id="assist" placeholder="Assists" min="0">
        <input type="number" id="salary" placeholder="Salary" min="0">
        <button type="submit">Add Player</button>
      </form>
    </section>

    <section class="form-section">
      <h2>🔍 Search Players</h2>
      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="searchInput" placeholder="Search by name (e.g., Owolabi, Adorable)" style="flex:1; padding:0.7rem; border:1px solid #ddd; border-radius:8px;">
        <button onclick="searchPlayers()" style="padding:0.7rem 1.2rem; background:#1e3c72; color:white; border:none; border-radius:8px; cursor:pointer;">Search</button>
        <button onclick="loadPlayers('all')" style="padding:0.7rem 1.2rem; background:#6c757d; color:white; border:none; border-radius:8px; cursor:pointer;">Clear</button>
      </div>
    </section>

    <div class="filters">
      <button onclick="loadPlayers('all')" class="active" id="btn-all">All Players</button>
      <button onclick="loadPlayers('eligible')" id="btn-eligible">✅ Eligible</button>
      <button onclick="loadPlayers('waiting')" id="btn-waiting">⏳ Waiting</button>
      <button onclick="loadPlayers('top-scorer')" id="btn-top">🏆 Top Scorer</button>
    </div>

    <section class="table-section">
      <h2 id="tableTitle">Full Squad</h2>
      <div class="table-wrapper">
        <table id="squadTable">
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Age</th><th>Position</th><th>Jersey</th><th>Goals</th><th>Assist</th><th>Salary</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="squadBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <footer>
    <p>Day 9 Complete CRUD | Engr-Owolabi | <a href="/api/players" target="_blank">API</a> | <a href="https://github.com/Engr-Owolabi/tripple-t-football-club" target="_blank">GitHub</a></p>
  </footer>

  <script src="app.js"></script>
